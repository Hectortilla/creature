name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so back/front jobs run only when relevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      harness: ${{ steps.filter.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'back/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'front/**'
              - '.github/workflows/ci.yml'
            # Harness/loop paths that match neither back nor front: without this
            # a PR touching only these runs zero substantive jobs (harness-smoke).
            harness:
              - 'Makefile'
              - 'scripts/**'
              - '.claude/skills/**'

  # Backend "done" gate: ruff (lint + format), mypy, import-linter, unit tests.
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    # Booting the ASGI app (TestClient in the unit smoke test) connects the
    # broadcaster on lifespan startup — a real Redis connection once REDIS_URL
    # is set. Fail-fast: exercise the dependency, don't mask it behind memory://.
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Gate (lint · format · types · boundaries · tests)
        run: make check

  # Integration tests against real Postgres + Redis (marker: integration).
  backend-integration:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creature
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creature
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Integration tests
        run: uv run pytest -m integration

  # Frontend "done" gate: prettier + eslint, svelte-check, vitest, boundaries, build.
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    env:
      # Inlined into the production build (npm run build), same as the e2e job.
      PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      # eslint is ratcheted (high-volume legacy rules are warnings; see
      # front/eslint.config.js) and prettier is clean, so lint now gates.
      - name: Lint (prettier + eslint)
        run: npm run lint
      # svelte-check still carries pre-existing type debt (incl. babylon-editor/src);
      # non-blocking until cleared (tracked in docs/harness.md). Don't add new errors.
      - name: Type-check (svelte-check) — non-blocking
        run: npm run check
        continue-on-error: true
      # The Playwright specs sit outside the SvelteKit tsconfig; this checks them
      # against the shared window.__creature contract (front/e2e/tsconfig.json).
      # Clean from day one, so it gates.
      - name: Type-check (e2e specs)
        run: npm run check:e2e
      - name: Unit tests (vitest)
        run: npm run test
      - name: Module boundaries (dependency-cruiser)
        run: npm run deps:check
      - name: Build
        run: npm run build
      # Dead code / unused exports & deps. Non-blocking baseline (surfaces some
      # genuinely dead app/legacy files); tighten to gating once triaged. See
      # docs/harness.md.
      - name: Dead code (knip) — non-blocking
        run: npm run knip
        continue-on-error: true

  # Running-app E2E smoke (Playwright). Exercises the integrated stack in a real
  # browser. Split gating: auth + the five stable gameplay specs GATE (blocking,
  # @gating); only the real-pointer spec (pointer.e2e.ts, @nongating) stays
  # continue-on-error until it earns its own promotion (the others passed clean
  # across every measured `main` run; pointer was the sole streak-resetter).
  # Playwright's webServer (reuseExistingServer: !CI) boots BOTH the backend
  # (uvicorn :8000) and the production preview build (:4173) itself — see
  # front/playwright.config.ts — so no manual server start / build step here.
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creature
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creature
      REDIS_URL: redis://localhost:6379
      # Inlined into the preview build (front/playwright.config.ts webServer.env
      # also pins it, but set here so the backend webServer + global-setup agree).
      PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python + backend deps
        working-directory: back
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Apply migrations
        working-directory: back
        run: uv run alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install frontend deps
        working-directory: front
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: front
        run: npx playwright install --with-deps chromium
      # Whole e2e suite — all specs now @gating (no @nongating tier remains).
      # BLOCKING: any failure fails the job and ci-ok.
      - name: E2E suite (auth + gameplay)
        working-directory: front
        run: npm run test:e2e
      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            front/playwright-report/
            front/test-results/
          retention-days: 7

  # Harness/loop paths (root Makefile, scripts/**, .claude/skills/**) match neither
  # the backend nor frontend filter, so a PR touching only those would run zero
  # substantive jobs and ci-ok would go vacuously green. This smoke gives such PRs
  # a real pass/fail signal — distinct from harness-guard, which only checks for
  # the human `harness-change` label, not that the loop driver still works.
  harness-smoke:
    needs: changes
    if: ${{ needs.changes.outputs.harness == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Loop driver compiles
        run: python3 -m py_compile scripts/ralph_loop.py
      - name: Root Makefile parses
        run: make -n up >/dev/null

  # Aggregate status so branch protection can require a single check.
  # The tamper tripwire lives in a separate workflow (harness-guard.yml) so it can
  # re-run on label changes without re-running this whole suite — `needs:` can't
  # span workflows, so branch protection must require BOTH `ci-ok` and
  # `harness-guard` (see docs/harness.md and the plan's Step 5 human action).
  ci-ok:
    needs: [backend, backend-integration, frontend, e2e, harness-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded (skipped is OK)
        run: |
          for r in "${{ needs.backend.result }}" "${{ needs.backend-integration.result }}" "${{ needs.frontend.result }}" "${{ needs.e2e.result }}" "${{ needs.harness-smoke.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job failed: $r"; exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
