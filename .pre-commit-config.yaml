# Fast, "keep quality left" gate run on changed files at commit time.
#   pipx install pre-commit  (or: uv tool install pre-commit)
#   pre-commit install
# Heavier checks (mypy, import-linter, svelte-check, vitest, build) run in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Backend: ruff lint (+autofix) and format, scoped to back/.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        name: ruff lint (backend)
        args: [--fix]
        files: ^back/.*\.py$
      - id: ruff-format
        name: ruff format (backend)
        files: ^back/.*\.py$

  # Frontend: prettier + eslint over front/ when any front file is staged. The
  # eslint backlog is cleared (high-volume legacy rules are ratcheted to warnings
  # in front/eslint.config.js), so this gates on errors. svelte-check still carries
  # pre-existing type debt and runs in CI only (non-blocking).
  - repo: local
    hooks:
      - id: frontend-lint
        name: prettier + eslint (frontend)
        language: system
        entry: bash -c 'cd front && npm run lint'
        files: ^front/.*\.(ts|js|svelte|css|scss)$
        pass_filenames: false
