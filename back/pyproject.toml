[project]
name = "back"
version = "0.1.0"
description = "Creature Card Game API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "broadcaster>=0.3.1",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "redis[hiredis]>=7.1.0",
    "sqladmin>=0.24.0",
    "structlog>=25.5.0",
    "asgi-correlation-id>=4.3.4",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-exporter-otlp>=1.42.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

# ─────────────────────────────────────────────────────────────────────────────
# Harness: computational sensors. See ../docs/harness.md and ./AGENTS.md.
# `make check` runs ruff + mypy + import-linter + pytest as the "done" gate.
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# C4 comprehensions, SIM simplify, RUF ruff-specific.
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI uses `Depends()`/`Annotated[..., Depends()]` in defaults
    "RUF012", # Pydantic/SQLModel field defaults are mutable by design
    "UP042",  # enum.StrEnum migration deferred (subtle serialization changes)
    "UP046",  # PEP 695 generic classes — cosmetic, deferred
    "UP047",  # PEP 695 generic functions — cosmetic, deferred
    "RUF003", # ambiguous unicode in comments only — harmless
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F811"]                          # pytest fixture reuse
"alembic/versions/*.py" = ["F401", "E402", "F841"]  # autogenerated migrations
"app/**/__init__.py" = ["F401", "E402"]             # re-export hubs interleave imports
"app/models/game/__init__.py" = ["F403", "F405"]    # `from .events import *`
"app/services/base.py" = ["E402"]                   # deferred model imports (see file comment)

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
# Full annotation coverage (`disallow_untyped_defs`) is a later harness rung —
# see docs/harness.md. Today mypy gates the engine for *bug-catching* errors
# (None-safety, wrong argument/return types), not annotation completeness.

# The game engine is the crown jewel — checked for real type errors. The two
# disabled codes are Pydantic-pattern false positives: `override` (actions define
# `validate`, intentionally shadowing BaseModel's deprecated classmethod) and
# `prop-decorator` (mypy can't model stacked @computed_field/@property).
[[tool.mypy.overrides]]
module = ["app.game.*", "app.models.game.*"]
disable_error_code = ["override", "prop-decorator"]

# Type coverage beyond the engine is a follow-up rung (see docs/harness.md):
# this framework-integration code leans on dynamic FastAPI/SQLModel patterns.
[[tool.mypy.overrides]]
module = [
    "app.routers.*",
    "app.websocket.*",
    "app.services.*",
    "app.settings.*",
    "app.auth.*",
    "app.database",
    "app.models.db.*",
    "app.models.schemas.*",
    "app.utils.*",
]
ignore_errors = true

# Third-party packages without published type stubs.
[[tool.mypy.overrides]]
module = ["broadcaster.*", "sqladmin.*", "pwdlib.*", "hiredis.*"]
ignore_missing_imports = true

# Alembic migrations are generated; don't type-check them.
[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: pure in-memory engine/model tests (no DB/Redis)",
    "integration: requires Postgres and/or Redis",
]
# Warnings are errors — keep the tree warning-clean. Add narrowly-scoped entries
# here (each with a reason) only for genuinely un-fixable third-party warnings;
# never a blanket `ignore`. See docs/harness.md.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/settings/admin/*", "alembic/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# Coverage ratchet. Unit-test floor measured at ~64% (the engine + model layers
# are well-covered; framework/IO code is exercised by the integration suite).
# Keep this just below the baseline and ratchet it upward as coverage grows.
fail_under = 62

# ─────────────────────────────────────────────────────────────────────────────
# Harness: architecture-fitness sensor (import-linter). Run with `make arch`.
# Enforces the two highest-value boundaries as deterministic tests. A full
# top-to-bottom layered contract is a follow-up rung: today's code has known
# upward edges (e.g. models.db.user -> services/websocket, auth -> services)
# captured in ignore_imports below and documented in docs/architecture.md.
# See docs/harness.md.
# ─────────────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "app"

# The crown jewel: the stateless engine must never import persistence, web,
# auth, or service code. This turns the "pure engine" invariant into a test.
# The ignored edges are the GameRoom type, which currently lives in
# app.websocket.models (known debt — it belongs in app.models.game).
[[tool.importlinter.contracts]]
name = "Game engine stays pure (no DB, services, routing, or auth)"
type = "forbidden"
source_modules = ["app.game"]
forbidden_modules = [
    "app.routers",
    "app.services",
    "app.websocket",
    "app.database",
    "app.auth",
    "app.models.db",
]
ignore_imports = [
    "app.game.engine -> app.websocket.models",        # GameRoom type hint (TYPE_CHECKING)
    "app.models.game.state -> app.websocket.models",  # GameRoom data shape (transitive)
]

# The data/model layer must not reach into application machinery. The ignored
# edges are pre-existing debt (a DB model and DTOs importing upward); new
# violations beyond these will fail. See docs/architecture.md.
[[tool.importlinter.contracts]]
name = "Models do not import application machinery"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = ["app.routers", "app.services", "app.websocket", "app.auth"]
ignore_imports = [
    "app.models.db.user -> app.services.decks",
    "app.models.db.user -> app.websocket.serialization",
    "app.models.game.state -> app.websocket.models",
    "app.models.schemas.websocket.server -> app.websocket.models",
]
