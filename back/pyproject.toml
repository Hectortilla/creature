[project]
name = "back"
version = "0.1.0"
description = "Creature Card Game API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "broadcaster>=0.3.1",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "redis[hiredis]>=7.1.0",
    "sqladmin>=0.24.0",
    "structlog>=25.5.0",
    "asgi-correlation-id>=4.3.4",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-exporter-otlp>=1.42.1",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "hypothesis>=6.140.3",
    "import-linter>=2.11",
    "mutmut>=3.5.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "syrupy>=5.2.0",
    "vulture>=2.16",
]

# ─────────────────────────────────────────────────────────────────────────────
# Harness: computational sensors. See ../docs/harness.md and ./AGENTS.md.
# `make check` runs ruff + mypy + import-linter + pytest as the "done" gate.
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# C4 comprehensions, SIM simplify, RUF ruff-specific.
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI uses `Depends()`/`Annotated[..., Depends()]` in defaults
    "RUF012", # Pydantic/SQLModel field defaults are mutable by design
    "UP042",  # enum.StrEnum migration deferred (subtle serialization changes)
    "UP046",  # PEP 695 generic classes — cosmetic, deferred
    "UP047",  # PEP 695 generic functions — cosmetic, deferred
    "RUF003", # ambiguous unicode in comments only — harmless
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F811"]                          # pytest fixture reuse
"alembic/versions/*.py" = ["F401", "E402", "F841"]  # autogenerated migrations
"app/**/__init__.py" = ["F401", "E402"]             # re-export hubs interleave imports
"app/models/game/__init__.py" = ["F403", "F405"]    # `from .events import *`
"app/services/base.py" = ["E402"]                   # deferred model imports (see file comment)

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
# Full annotation coverage (`disallow_untyped_defs`) is a later harness rung —
# see docs/harness.md. Today mypy gates the engine for *bug-catching* errors
# (None-safety, wrong argument/return types), not annotation completeness.

# The game engine is the crown jewel — checked for real type errors. The two
# disabled codes are Pydantic-pattern false positives: `override` (actions define
# `validate`, intentionally shadowing BaseModel's deprecated classmethod) and
# `prop-decorator` (mypy can't model stacked @computed_field/@property).
[[tool.mypy.overrides]]
module = ["app.game.*", "app.models.game.*"]
disable_error_code = ["override", "prop-decorator"]

# Pydantic schemas use stacked @computed_field/@property that mypy can't model.
[[tool.mypy.overrides]]
module = ["app.models.schemas.*"]
disable_error_code = ["prop-decorator"]

# Remaining type-coverage rung (see docs/harness.md): app.settings is framework
# glue (sqladmin/otel/structlog) plus codegen-only dummy endpoints.
[[tool.mypy.overrides]]
module = ["app.settings.*"]
ignore_errors = true

# Third-party packages without published type stubs.
[[tool.mypy.overrides]]
module = ["broadcaster.*", "sqladmin.*", "pwdlib.*", "hiredis.*"]
ignore_missing_imports = true

# Alembic migrations are generated; don't type-check them.
[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --no-header --strict-markers"
markers = [
    "unit: pure in-memory engine/model tests (no DB/Redis)",
    "integration: requires Postgres and/or Redis",
]
# Warnings are errors — keep the tree warning-clean. Add narrowly-scoped entries
# here (each with a reason) only for genuinely un-fixable third-party warnings;
# never a blanket `ignore`. See docs/harness.md.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/settings/admin/*", "alembic/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# Coverage ratchet. Unit-test floor measured at ~64% (the engine + model layers
# are well-covered; framework/IO code is exercised by the integration suite).
# Keep this just below the baseline and ratchet it upward as coverage grows.
fail_under = 62

# ─────────────────────────────────────────────────────────────────────────────
# Harness: architecture-fitness sensor (import-linter). Run with `make arch`.
# Three contracts turn the dependency rules in docs/architecture.md into tests:
# the engine stays pure, models never import application machinery, and the whole
# stack is layered so dependencies only ever point downward.
# ─────────────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "app"

# The crown jewel: the stateless engine must never import persistence, web,
# auth, or service code. This turns the "pure engine" invariant into a test.
[[tool.importlinter.contracts]]
name = "Game engine stays pure (no DB, services, routing, or auth)"
type = "forbidden"
source_modules = ["app.game"]
forbidden_modules = [
    "app.routers",
    "app.services",
    "app.websocket",
    "app.database",
    "app.auth",
    "app.models.db",
]

# The data/model layer must not reach into application machinery.
[[tool.importlinter.contracts]]
name = "Models do not import application machinery"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = ["app.routers", "app.services", "app.websocket", "app.auth"]

# Full layered architecture: dependencies point downward only. routers and the
# websocket transport are independent entry points above the service layer;
# app.models is treated as a single layer (its internals are governed by the
# contract above), and app.settings.* is omitted as peripheral config/admin. The
# one accepted upward edge is a lazy, function-local import that breaks a cycle
# (see docs/architecture.md).
[[tool.importlinter.contracts]]
name = "Layered architecture (dependencies point downward)"
type = "layers"
containers = ["app"]
layers = [
    "routers | websocket",
    "services",
    "game",
    "auth",
    "database",
    "models",
    "utils",
]
ignore_imports = [
    "app.models.game.state -> app.game.effects",  # lazy cycle-breaker (docs/architecture.md)
]

# The websocket layer is itself layered: a one-way chain from the per-connection
# lifecycle down to raw transport. This locks the structure in so the pieces
# can't re-tangle (e.g. transport reaching back up into rooms or gameplay).
[[tool.importlinter.contracts]]
name = "WebSocket internals stay layered (dependencies point downward)"
type = "layers"
containers = ["app.websocket"]
layers = [
    "session",
    "message_router",
    "game_runner",
    "lobby",
    "room_registry",
    "connections",
]

# ─────────────────────────────────────────────────────────────────────────────
# Harness: dead-code / dependency-drift sensors. Run with `make deadcode`.
# ─────────────────────────────────────────────────────────────────────────────

# vulture — dead code. Confidence 80 keeps it to high-signal findings.
[tool.vulture]
paths = ["app"]
min_confidence = 80
ignore_names = ["__context"]  # pydantic model_post_init(self, __context) hook param

# deptry — dependency drift (unused / missing / misdeclared). The ignores are all
# intentional: pydantic & sqlalchemy are guaranteed-present and used directly but
# come via our declared framework stack (fastapi, sqlmodel); wtforms & markupsafe
# ship with sqladmin (admin glue only); psycopg2-binary is the runtime Postgres
# driver, loaded via DATABASE_URL and never imported.
[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg2-binary"]
DEP003 = ["pydantic", "sqlalchemy", "wtforms", "markupsafe"]

# ─────────────────────────────────────────────────────────────────────────────
# Harness: mutation testing (periodic, not gating). Scoped to the pure, fast
# engine. Run a full pass with `mutmut run`; surfaced nightly in CI (mutation.yml).
# ─────────────────────────────────────────────────────────────────────────────
[tool.mutmut]
paths_to_mutate = ["app/game/"]
# Corpus = the pure-engine tests only. The other tests/unit/ files exercise the
# API/websocket/service layers and need a live Redis/DB, which would break
# mutmut's hermetic clean-test pass; add new pure-engine unit files here.
tests_dir = [
    "tests/behaviour/",
    "tests/unit/test_actions.py",
    "tests/unit/test_damage_math.py",
    "tests/unit/test_damage_properties.py",
    "tests/unit/test_effects.py",
    "tests/unit/test_engine_properties.py",
    "tests/unit/test_engine_smoke.py",
    "tests/unit/test_rng_determinism.py",
    "tests/unit/test_rng_multi_action.py",
]
# Only app/game/ is mutated, but the engine + its tests import the rest of the
# package (app.models, …), so copy all of app/ into the mutant sandbox or every
# run dies at import with ModuleNotFoundError.
also_copy = ["app/"]
